name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      - name: Smoke test — help output
        run: node bin/nextcool.js --help
        shell: bash

  # Dogfood the real `nextcool ci` against a minimal Next.js fixture.
  # Uses the locally built binary (the `ci` command isn't published yet),
  # exercises the build report, and diffs the client bundle vs the base branch.
  dogfood:
    name: Dogfood (nextcool ci on fixture)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Restore base branch fixture report
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: examples/next-app/.nextcool-baseline.json
          key: nextcool-fixture-report-${{ github.event.pull_request.base.sha }}

      - name: nextcool ci (dogfood)
        shell: bash
        run: |
          ARGS=(ci --cwd examples/next-app --report)
          BASE=examples/next-app/.nextcool-baseline.json
          if [ -f "$BASE" ]; then ARGS+=(--baseline "$BASE"); fi
          node bin/nextcool.js "${ARGS[@]}"

      - name: Save fixture report for future base diffs
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: examples/next-app/nextcool-report.json
          key: nextcool-fixture-report-${{ github.sha }}

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextcool-fixture-report
          path: examples/next-app/nextcool-report.json
          if-no-files-found: ignore
